services:
  - type: web
    name: yellow-beauty-register
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:10000 --workers 4"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yellow_beauty_db
          property: connectionString
      - key: SECRET_KEY
        value: "your_flask_secret_key"
      - key: INIT_SECRET
        value: "changeme"

databases:
  - name: yellow_beauty_db
    plan: free
