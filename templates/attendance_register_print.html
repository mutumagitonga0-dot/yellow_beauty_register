<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ month_name|upper }}-{{ year }} Attendance Register</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; margin: 10mm; }
    h2 { text-align: center; margin-bottom: 4px; }
    .generated { text-align: right; font-size: 10px; color: #555; margin-bottom: 8px; }

    .summary-cards { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .summary-card { border: 1px solid #000; padding: 4px 10px; text-align: center; min-width: 90px; }
    .summary-label { font-size: 9px; text-transform: uppercase; color: #333; }
    .summary-value { font-size: 14px; font-weight: 700; }

    table { border-collapse: collapse; width: 100%; font-size: 10px; }
    th, td { border: 1px solid #000; padding: 3px 4px; text-align: center; }
    thead th { background: #e9ecef; }
    .staff-name { text-align: left; min-width: 150px; font-weight: 600; }
    .week-end { border-right: 2px solid #000; }

    .status-p { color: #198754; font-weight: 700; }
    .status-o { color: #6c757d; }
    .status-a { color: #dc3545; font-weight: 700; }
    .status-l { color: #fd7e14; font-weight: 700; }

    @page { size: landscape; margin: 8mm; }
  </style>
</head>
<body onload="window.print()">

  <h2>{{ month_name|upper }}-{{ year }} Attendance Register</h2>
  <div class="generated">Generated {{ now }}</div>

  {% include "_register_summary.html" %}

  {% include "_register_table.html" %}

</body>
</html>
