{% extends "layout.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}

<style>
  body {
    background: url("{{ url_for('static', filename='images/password_reset_b.png') }}") no-repeat center center fixed;
    background-size: cover;
  }
  .reset-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reset-card {
    max-width: 350px;   /* small rectangular size */
    border-radius: 8px; /* subtle rounded corners */
    backdrop-filter: blur(6px);
    background: rgba(255, 255, 255, 0.95);
  }
  .toggle-password {
    cursor: pointer;
  }
</style>



<div class="reset-wrapper">
  <div class="col-md-4"> <!-- narrower column -->
    <div class="card shadow-lg reset-card">
      <div class="card-header bg-primary text-white text-center">
        <h6 class="mb-0">🔐 Reset Password</h6>
      </div>
      <div class="card-body">
        <form id="resetForm" method="POST" action="{{ url_for('reset_password', token=token) }}">
          <!-- Current password -->
          <div class="mb-3 position-relative">
            <label for="current_password" class="form-label">Current Password</label>
            <input type="password" id="current_password" name="current_password" class="form-control form-control-sm" required>
            <span class="position-absolute top-50 end-0 translate-middle-y me-3 toggle-password" data-target="current_password">
              <i class="fa fa-eye"></i>
            </span>
          </div>

          <!-- New password -->
          <div class="mb-3 position-relative">
            <label for="password" class="form-label">New Password</label>
            <input type="password" id="password" name="password" class="form-control form-control-sm" required>
            <span class="position-absolute top-50 end-0 translate-middle-y me-3 toggle-password" data-target="password">
              <i class="fa fa-eye"></i>
            </span>
            <div class="progress mt-1" style="height: 5px;">
              <div id="passwordStrengthBar" class="progress-bar" role="progressbar"
                   style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <small id="passwordStrengthText" class="text-muted">At least 5 characters.</small>
          </div>

          <!-- Confirm password -->
          <div class="mb-3 position-relative">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control form-control-sm" required>
            <span class="position-absolute top-50 end-0 translate-middle-y me-3 toggle-password" data-target="confirm_password">
              <i class="fa fa-eye"></i>
            </span>
          </div>

          <button type="submit" class="btn btn-success btn-sm w-100">Update Password</button>
        </form>
        <!-- Inline alert area -->
        <div id="resetAlert" class="mt-2"></div>
      </div>
      <div class="card-footer text-center">
        <a href="{{ url_for('profile') }}" class="btn btn-link btn-sm">⬅ Back to Profile</a>
      </div>
    </div>
  </div>
</div>


<!-- ✅ Password Strength Script -->
<script>
document.getElementById('password').addEventListener('input', function() {
  const val = this.value;
  const bar = document.getElementById('passwordStrengthBar');
  const text = document.getElementById('passwordStrengthText');
  let strength = 0;

  if (val.length >= 8) strength += 1;
  if (/[A-Z]/.test(val)) strength += 1;
  if (/[0-9]/.test(val)) strength += 1;
  if (/[^A-Za-z0-9]/.test(val)) strength += 1;
  if (val.length >= 12) strength += 1;

  let percent = (strength / 5) * 100;
  bar.style.width = percent + "%";
  bar.setAttribute("aria-valuenow", percent);

  if (strength <= 2) {
    bar.className = "progress-bar bg-danger";
    text.textContent = "Strength: Weak";
    text.style.color = "red";
  } else if (strength === 3) {
    bar.className = "progress-bar bg-warning";
    text.textContent = "Strength: Medium";
    text.style.color = "orange";
  } else {
    bar.className = "progress-bar bg-success";
    text.textContent = "Strength: Strong";
    text.style.color = "green";
  }
});
</script>

<!-- ✅ Show/Hide Password Script -->
<script>
document.querySelectorAll('.toggle-password').forEach(function(toggle) {
  toggle.addEventListener('click', function() {
    const targetId = this.getAttribute('data-target');
    const input = document.getElementById(targetId);
    const icon = this.querySelector('i');
    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  });
});
</script>

<script>
document.getElementById("resetForm").addEventListener("submit", function(e) {
  e.preventDefault(); // stop normal form submit

  const formData = new FormData(this);
  fetch(this.action, {
    method: "POST",
    body: formData
  })
  .then(response => response.json())
  .then(data => {
    const alertBox = document.getElementById("resetAlert");
    if (data.status === "success") {
      alertBox.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
      // Optionally redirect after a delay
      setTimeout(() => window.location.href = "{{ url_for('profile') }}", 2000);
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
    }
  })
  .catch(err => {
    console.error("Error:", err);
    document.getElementById("resetAlert").innerHTML =
      `<div class="alert alert-danger">Something went wrong. Try again.</div>`;
  });
});
</script>


{% endblock %}
