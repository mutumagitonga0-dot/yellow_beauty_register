{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">
    <i class="bi bi-bar-chart-line me-2"></i> Attendance Summary Report
  </h2>

   
  <!-- Filters -->
  <form id="attendanceReportForm" class="row g-3 mb-3">
  <!-- Date Range -->
  <div class="col-md-4">
    <label class="form-label">Date Range</label>
    <input type="date" class="form-control" name="start_date" id="start_date" required>
    <input type="date" class="form-control mt-2" name="end_date" id="end_date" required>
  </div>
<!--/form-->

<script>
document.addEventListener("DOMContentLoaded", function() {
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("start_date").value = today;
  document.getElementById("end_date").value = today;
});
</script>

<!-- users -->
    <div class="col-md-4">
  <label class="form-label">Users</label>
  <!-- Select All toggle -->
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="selectAllUsers">
    <label class="form-check-label" for="selectAllUsers">Select All Users</label>
  </div>

  <div class="border rounded p-2 bg-light" style="max-height:80px; overflow-y:auto;">
    {% for user in users %}
    <div class="form-check">
      <input class="form-check-input user-checkbox" type="checkbox" name="user_ids" value="{{ user.id }}" checked>
      <label class="form-check-label">{{ user.username }}</label>
    </div>
    {% endfor %}
  </div>
</div>


    <!-- Outlets -->
    <div class="col-md-4">
  <label class="form-label">Outlets</label>
  <!-- Select All toggle -->
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="selectAllOutlets">
    <label class="form-check-label" for="selectAllOutlets">Select All Outlets</label>
  </div>

  <div class="border rounded p-2 bg-light" style="max-height:80px; overflow-y:auto;">
    {% for outlet in outlets %}
    <div class="form-check">
      <input class="form-check-input outlet-checkbox" type="checkbox" name="outlet_ids" value="{{ outlet.outlet_id }}" checked>
      <label class="form-check-label">{{ outlet.name }}</label>
    </div>
    {% endfor %}
  </div>
</div>

  </form>

  <!-- Report Table -->
  <div class="table-responsive">
    <table class="table table-striped table-hover" id="attendanceReportTable">
      <thead class="table-dark">
        <tr>
          <th>User ID</th>
          <th>Username</th>
          <th>Recent Clock-In</th>
          <th>Recent Clock-Out</th>
          <th>Outlets Clocked</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Footer Actions -->
  <div class="d-flex justify-content-between mt-3">
    <div>
      <button type="button" class="btn btn-outline-success" id="exportCSV">
        <i class="bi bi-file-earmark-spreadsheet me-1"></i> CSV
      </button>
      <button type="button" class="btn btn-outline-info" id="exportExcel">
        <i class="bi bi-file-earmark-excel me-1"></i> Excel
      </button>
      <button type="button" class="btn btn-outline-danger" id="exportPDF">
        <i class="bi bi-file-earmark-pdf me-1"></i> PDF
      </button>
    </div>
    <div>
      <a href="{{ url_for('settings') }}" class="btn btn-secondary">Back To Panel</a>
      <button type="button" class="btn btn-primary" id="processReportBtn">
        <i class="bi bi-play-circle me-1"></i> Process Report
      </button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const processBtn = document.getElementById("processReportBtn");
  const reportTableBody = document.querySelector("#attendanceReportTable tbody");

  processBtn.addEventListener("click", async function() {
    const form = document.getElementById("attendanceReportForm");
    const formData = new FormData(form);

    try {
      const response = await fetch("/generate_attendance_report", {
        method: "POST",
        body: formData
      });
      const data = await response.json();

      reportTableBody.innerHTML = "";
      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.user_id}</td>
          <td>${row.username}</td>
          <td>${row.recent_clock_in || "-"}</td>
          <td>${row.recent_clock_out || "-"}</td>
          <td>${row.outlets_clocked.join(", ")}</td>
          <td>${row.status}</td>
        `;
        reportTableBody.appendChild(tr);
      });
    } catch (err) {
      console.error("Error generating report:", err);
      reportTableBody.innerHTML = `<tr><td colspan="6" class="text-danger">Failed to load report data.</td></tr>`;
    }
  });

  // Export handlers
  document.getElementById("exportCSV").addEventListener("click", () => exportTable("csv"));
  document.getElementById("exportExcel").addEventListener("click", () => exportTable("xlsx"));
  document.getElementById("exportPDF").addEventListener("click", () => exportTable("pdf"));

  function exportTable(format) {
    const rows = [];
    document.querySelectorAll("#attendanceReportTable tr").forEach(tr => {
      const cells = Array.from(tr.querySelectorAll("td, th")).map(td => td.innerText);
      rows.push(cells.join(","));
    });
    const blob = new Blob([rows.join("\n")], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `attendance_report.${format}`;
    link.click();
  }
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  // Select All Users
  const selectAllUsers = document.getElementById("selectAllUsers");
  const userCheckboxes = document.querySelectorAll(".user-checkbox");

  selectAllUsers.addEventListener("change", function() {
    userCheckboxes.forEach(cb => cb.checked = selectAllUsers.checked);
  });

  // Keep toggle in sync if user manually unchecks
  userCheckboxes.forEach(cb => {
    cb.addEventListener("change", function() {
      if (!cb.checked) selectAllUsers.checked = false;
      else if (Array.from(userCheckboxes).every(c => c.checked)) selectAllUsers.checked = true;
    });
  });

  // Select All Outlets
  const selectAllOutlets = document.getElementById("selectAllOutlets");
  const outletCheckboxes = document.querySelectorAll(".outlet-checkbox");

  selectAllOutlets.addEventListener("change", function() {
    outletCheckboxes.forEach(cb => cb.checked = selectAllOutlets.checked);
  });

  outletCheckboxes.forEach(cb => {
    cb.addEventListener("change", function() {
      if (!cb.checked) selectAllOutlets.checked = false;
      else if (Array.from(outletCheckboxes).every(c => c.checked)) selectAllOutlets.checked = true;
    });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const processBtn = document.getElementById("processReportBtn");
  const reportTableBody = document.querySelector("#attendanceReportTable tbody");

  processBtn.addEventListener("click", async function() {
    // Disable button and show busy cursor
    processBtn.disabled = true;
    document.body.style.cursor = "wait";
    processBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Processing...';

    const form = document.getElementById("attendanceReportForm");
    const formData = new FormData(form);

    try {
      const response = await fetch("/generate_attendance_report", {
        method: "POST",
        body: formData
      });
      const data = await response.json();

      // Clear table
      reportTableBody.innerHTML = "";

      // Populate table rows
      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.user_id}</td>
          <td>${row.username}</td>
          <td>${row.recent_clock_in || "-"}</td>
          <td>${row.recent_clock_out || "-"}</td>
          <td>${row.outlets_clocked.join(", ")}</td>
          <td>${row.status}</td>
        `;
        reportTableBody.appendChild(tr);
      });
    } catch (err) {
      console.error("Error generating report:", err);
      reportTableBody.innerHTML = `<tr><td colspan="6" class="text-danger">Failed to load report data.</td></tr>`;
    } finally {
      // Reset button and cursor
      processBtn.disabled = false;
      document.body.style.cursor = "default";
      processBtn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Process Report';
    }
  });
});
</script>


{% endblock %}
